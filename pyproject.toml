[project]
name = "basket"
version = "0.1.0"
description = "Recipe-to-cart grocery agent"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.6",
  "pulp>=2.8,<3",
  "lightgbm>=4.3",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
