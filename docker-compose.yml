services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: basket
      POSTGRES_PASSWORD: basket
      POSTGRES_DB: basket
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basket -d basket"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://basket:basket@db:5432/basket
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
